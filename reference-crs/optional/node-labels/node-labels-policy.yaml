---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: node-labels
  namespace: hub-policies
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/description: Apply configured labels to selected OpenShift nodes.
    policy.open-cluster-management.io/standards: NIST SP 800-53
    argocd.argoproj.io/sync-wave: "-35"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  disabled: true
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: node-labels-configuration
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Node
                metadata:
                  name: replace-with-node-name
                  labels:
                    node-labels.example.com/replace-with-label: "true"
